# Dependabot keeps three kinds of pin current: the action SHAs in .github/workflows/, the exact
# versions in pyproject.toml with their hashes in uv.lock, and the image digests in the Dockerfile.
# Weekly, one grouped PR per ecosystem, so a Monday brings at most three PRs to look at.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The image's Python minor version is chosen by hand: it must be one CI tests against and
    # one every compiled dependency has a musl wheel for. Dependabot keeps the digest current.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      images:
        patterns: ["*"]
