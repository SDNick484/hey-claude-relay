name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token gets nothing it doesn't need: this workflow only reads the checkout.
permissions:
  contents: read

# One run per branch: a push to a PR branch cancels the run for the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the Docker image runs; 3.14 is ahead of it, so a break there is a heads-up.
        python-version: ["3.13", "3.14"]
    env:
      UV_LOCKED: "1" # every uv command fails if uv.lock is out of step with pyproject.toml
    steps:
      # Actions pinned to a commit, not a tag: a tag can be moved. The comment is the version the
      # SHA was taken from; Dependabot (.github/dependabot.yml) bumps both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing

  # The image as it will be deployed: built on Alpine (musl), started with the example
  # configuration, and asked the two things that need no credentials.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t relay:ci .
      # Placeholders, not secrets: nothing in this job reaches a real service.
      - name: Write a placeholder environment file
        run: |
          cat > ci.env <<'ENV'
          ANTHROPIC_API_KEY=placeholder-not-a-real-key
          CF_ACCESS_CLIENT_ID=placeholder.access
          CF_ACCESS_CLIENT_SECRET=placeholder-not-a-real-secret
          COOKBOOKS_MCP_TOKEN=placeholder-not-a-real-token
          ENV
          sed -i 's/^ *//' ci.env
      - name: Hash a throwaway passphrase with the image's own command
        run: printf 'a throwaway phrase for ci\n' | docker run --rm -i relay:ci hash-passphrase >> ci.env
      - name: The example configuration is usable
        run: docker run --rm --env-file ci.env -v "$PWD/relay.example.toml:/config/relay.toml:ro" relay:ci check-config
      - name: Start the relay
        run: |
          docker run -d --name relay -p 127.0.0.1:8787:8787 --env-file ci.env \
            -v "$PWD/relay.example.toml:/config/relay.toml:ro" relay:ci
      - name: /healthz answers and names this commit
        run: |
          out=""
          for _ in $(seq 1 30); do
            if out=$(curl -fsS http://127.0.0.1:8787/healthz); then break; fi
            sleep 1
          done
          echo "$out"
          echo "$out" | grep -q '"status":"ok"'
          echo "$out" | grep -q "$GITHUB_SHA"
      - name: A turn without credentials is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"turn_id":"ci","text":"hello"}' http://127.0.0.1:8787/v1/turn)
          echo "POST /v1/turn without credentials -> $code"
          test "$code" = "403"
      - name: Container log
        if: always()
        run: docker logs relay

  # The native install: dist/setup-hey-claude-relay.sh in an Alpine container that boots OpenRC,
  # as an LXC container does. 3.22 ships Python 3.12 and 3.24 ships 3.14; on both, uv installs the
  # 3.13 the image runs. installer/e2e.sh installs, configures with placeholders, starts, upgrades,
  # rolls back a broken upgrade and uninstalls. The images are pinned by digest; bump them by hand.
  alpine-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
          - alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck the installer
        run: shellcheck -s sh installer/build.sh installer/setup-head.sh installer/e2e.sh installer/hey-claude-relay.wrapper installer/hey-claude-relay.initd
      - name: Build the installer
        run: sh installer/build.sh
      - name: Install, start, upgrade, roll back and uninstall
        run: sh installer/e2e.sh "${{ matrix.image }}"
