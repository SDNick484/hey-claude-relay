# hey-claude-relay configuration.
#
#   cp relay.example.toml relay.toml && vim relay.toml
#
# relay.toml is gitignored. Secrets are never written here: they come from the environment
# (see "Deploying" in the README). An unknown key stops startup, so a typo cannot quietly
# switch a setting off.

model = "claude-sonnet-5-5"   # a faster model is a one-line change
effort = "low"                # how hard the model thinks; low keeps replies quick
idle_minutes = 15             # a conversation is forgotten after this long without a turn

# The voice instructions. Leave this out to use the prompt that ships with the relay. To change
# them, put your own file next to relay.toml and name it here; it is read when each conversation
# starts, so an edit needs no restart.
# prompt_file = "voice.md"

# The Cloudflare Access application in front of the relay. With no [access] table the relay
# serves this machine only.
[access]
team_domain = "example.cloudflareaccess.com"
audiences = ["replace-with-the-access-application-aud-tag"]
# The service tokens allowed to call the relay are the [[caller]] tables below. A relay with one
# kind of caller can list them here instead, with no [[caller]] or [[profile]] tables:
#   service_tokens = ["replace-with-the-phone-token-client-id.access"]
# One way or the other, not both.

# --- Callers and profiles ----------------------------------------------------------------
# A [[caller]] is one Access service token (its Client ID, which ends in .access) and the
# profiles it may use. The first is its default. A request may ask for another of them with
# "profile"; one the token is not allowed gets a 403, whatever the request says.
#
# A [[profile]] is a set of rules for a place. It can only take away from what the [[server]]
# sections allow, never add: a profile naming a server, a tool or a service they do not
# allow stops startup.
#
#   servers = [...]          only these servers; leave out for all of them
#   tools = [...]            only these tools, as "server.tool" globs; leave out for all
#   allow_services = [...]   a service must match these as well as its server's own list
#   gated = "allow"          a call matching a [[gate]] is held for its checks, as on the phone
#   gated = "refuse"         it is refused outright, and nobody is asked for the passphrase
#   prompt_file = "..."      voice instructions for this profile, beside relay.toml
#
# gated is required on every profile once a [[gate]] exists.

[[caller]]
name = "phone"
token = "replace-with-the-phone-token-client-id.access"
profiles = ["personal"]

[[caller]]
name = "home-assistant"
token = "replace-with-the-home-assistant-token-client-id.access"
profiles = ["office", "shared"]                # the speaker picks one per room

[[profile]]
name = "personal"                              # everything the servers allow
gated = "allow"

[[profile]]
name = "office"
# "allow" only once you know Home Assistant keeps the passphrase out of its chat log and
# pipeline debug history. Until then, refuse: the garage stays a phone and car action.
gated = "refuse"

[[profile]]
name = "shared"                                # a room anyone may use
servers = ["cookbooks", "matinee", "home-assistant"]
gated = "refuse"
allow_services = ["light.*", "fan.*", "media_player.*"]
# prompt_file = "voice-shared.md"

# --- MCP servers -------------------------------------------------------------------------
# Each [[server]] is one MCP server the relay may use. Its tools reach Claude under the
# server's name ("matinee__search_collection"). Adding or removing a server is an edit here.
#
#   auth = "cf-service-token"   the server is behind Cloudflare Access; the relay sends the
#                               service token in CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET
#   auth = "bearer"             the server has its own token; token_env names the variable
#   auth = "none"               no credentials
#
#   tools = [...]               allow-list of tool names (globs); leave out to allow all
#   deny  = [...]               tool names never offered (globs)

[[server]]
name = "matinee"
url = "https://mcp.example.com/matinee/mcp"
auth = "cf-service-token"
# tools = ["search_*", "get_*", "list_*", "where_is"]

[[server]]
name = "cookbooks"
url = "https://cookbooks.example.com/mcp"
auth = "bearer"
token_env = "COOKBOOKS_MCP_TOKEN"

[[server]]
name = "home-assistant"
url = "https://ha-mcp.example.com/mcp"
auth = "cf-service-token"
# A large server: offer only what a voice turn needs. ha_bulk_control is left out on purpose:
# its actions ("on", "off") are not service names, so the rules below could not see through it.
tools = ["ha_search", "ha_get_state", "ha_get_overview", "ha_call_service"]
# ha_call_service can call anything, so the relay reads the service out of each call and applies
# its own lists. A call whose service cannot be read (the tool's raw ws_command form, for one)
# is refused.
service_from = { ha_call_service = "{domain}.{service}" }
# The other arguments such a call may carry. Any argument not named here or in the template
# (ws_command, for one) gets the call refused.
service_args = { ha_call_service = ["entity_id", "data"] }
# Only these may be called by voice. Globs. Everything else is refused, which is what keeps
# near-misses out: cover.toggle, lock.open, homeassistant.turn_on, any script or scene.
# Think before adding a domain: a switch, a scene or a script does whatever you wired it to do.
allow_services = [
    "light.*", "fan.*", "media_player.*", "climate.set_*",
    "cover.close_cover", "cover.stop_cover", "cover.open_cover",
    "lock.lock",
]
# Never by voice, whatever the allow-list says.
deny_services = ["lock.unlock", "lock.open", "alarm_control_panel.*"]

# --- Gates ---------------------------------------------------------------------------------
# A gate is a step-up: a call that matches is held by the relay, not run, until every check in
# `require` passes. The checks are the relay's own code, so nothing Claude reads (a misheard
# command, text inside a tool result) can talk its way past them.
#
#   "near-home"    the relay asks a server where you are (see [near_home]); if you are not
#                  near, the call is refused and no passphrase is asked for
#   "passphrase"   the reply is "Say your passphrase."; the next thing said on that
#                  conversation is compared with RELAY_PASSPHRASE_HASH and goes nowhere else
#
# What a gate is not: protection from someone who has heard the phrase in the car. The real
# credential is the caller's Access service token.

[[gate]]
server = "home-assistant"
match = { tool = "ha_call_service", service = "cover.open_cover" }
require = ["near-home", "passphrase"]

# How the relay finds out for itself whether you are near home: one tool call, where in its
# JSON answer the state is, and which states count as near.
[near_home]
server = "home-assistant"
tool = "ha_get_state"
arguments = { entity_id = "person.example", fields = ["state"] }
result_path = "data.state"
states = ["home"]                      # add a wider "arriving" zone here if you define one

[gates]
hold_seconds = 30                      # how long a held call waits for the passphrase
max_misses = 3                         # wrong passphrases before every gated action is locked
lockout_minutes = 15
