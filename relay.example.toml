# hey-claude-relay configuration.
#
#   cp relay.example.toml relay.toml && vim relay.toml
#
# relay.toml is gitignored. Secrets are never written here: they come from the environment
# (see "Deploying" in the README). An unknown key stops startup, so a typo cannot quietly
# switch a setting off.

model = "claude-sonnet-5-5"   # a faster model is a one-line change
effort = "low"                # how hard the model thinks; low keeps replies quick
idle_minutes = 15             # a conversation is forgotten after this long without a turn

# The voice instructions. Leave this out to use the prompt that ships with the relay. To change
# them, put your own file next to relay.toml and name it here; it is read when each conversation
# starts, so an edit needs no restart.
# prompt_file = "voice.md"

# The Cloudflare Access application in front of the relay, and the service tokens allowed to
# call it. With no [access] table the relay serves this machine only.
[access]
team_domain = "example.cloudflareaccess.com"
audiences = ["replace-with-the-access-application-aud-tag"]
service_tokens = ["replace-with-the-phone-token-client-id.access"]

# --- MCP servers -------------------------------------------------------------------------
# Each [[server]] is one MCP server the relay may use. Its tools reach Claude under the
# server's name ("matinee__search_collection"). Adding or removing a server is an edit here.
#
#   auth = "cf-service-token"   the server is behind Cloudflare Access; the relay sends the
#                               service token in CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET
#   auth = "bearer"             the server has its own token; token_env names the variable
#   auth = "none"               no credentials
#
#   tools = [...]               allow-list of tool names (globs); leave out to allow all
#   deny  = [...]               tool names never offered (globs)

[[server]]
name = "matinee"
url = "https://mcp.example.com/matinee/mcp"
auth = "cf-service-token"
# tools = ["search_*", "get_*", "list_*", "where_is"]

[[server]]
name = "cookbooks"
url = "https://cookbooks.example.com/mcp"
auth = "bearer"
token_env = "COOKBOOKS_MCP_TOKEN"

[[server]]
name = "home-assistant"
url = "https://ha-mcp.example.com/mcp"
auth = "cf-service-token"
# A large server: offer only what a voice turn needs.
tools = ["ha_search", "ha_get_state", "ha_get_overview", "ha_call_service"]
